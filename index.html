<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMatric</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>LeetMatric</h1>
        <div class="user-container">
            <p>Enter Your Username</p>
            <div class="user-data-container">
                <input type="text" placeholder="Enter Username Here" id="username">
                <button id="Search-btn">Search</button>
            </div>
        </div>
        <div class="states-container">

            <div class="progress">
                <div class="progress-items circle">
                    <div class="easy-container">
                        <span id="easy-label"></span>
                        Easy
                    </div>
                </div>

                <div class="progress-items circle">
                    <div class="medium-container">
                        <span id="medium-label"></span>
                        Medium
                    </div>
                </div>

                <div class="progress-items circle">
                    <div class="hard-container">
                        <span id="hard-label"></span>
                        Hard
                    </div>
                </div>

            </div>

            <div class="states-cards">
                <!-- JAVA SCRIPT SE BANAONGA -->
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
